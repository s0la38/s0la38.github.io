  <h1>プライバシーポリシー</h1>
  <p>本アプリは、利用者(所有者本人)のGoogleドライブ内のファイルを読み書きするために、OAuth認証を経由して付与されたアクセス権限(<code>https://www.googleapis.com/auth/drive.file</code> スコープ)のみを使用します。</p>
  <p>本アプリは、利用者のファイル内容を第三者へ送信・提供・販売することはありません。認証情報は利用者のデバイス内にのみ保存されます。</p>
  <p>お問い合わせ: 本ページ下部の連絡先(GitHubリポジトリのオーナー)まで。</p>
